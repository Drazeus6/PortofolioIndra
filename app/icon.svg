<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Outer ring accent (cyan) -->
  <circle cx="32" cy="32" r="28" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  
  <!-- Letter I - main stem -->
  <rect x="28" y="14" width="8" height="36" rx="2" fill="url(#goldGrad)"/>
  
  <!-- Top bar -->
  <rect x="20" y="14" width="24" height="7" rx="2" fill="url(#cyanGrad)"/>
  
  <!-- Bottom bar -->
  <rect x="20" y="43" width="24" height="7" rx="2" fill="url(#cyanGrad)"/>
  
  <!-- Small accent dot -->
  <circle cx="32" cy="32" r="2.5" fill="#f8fafc" opacity="0.9"/>

  <defs>
    <linearGradient id="goldGrad" x1="28" y1="14" x2="36" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="20" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
</svg>
